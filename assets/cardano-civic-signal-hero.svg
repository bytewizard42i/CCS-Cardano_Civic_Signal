<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Cardano Civic Signal</title>
  <desc id="desc">A futuristic decentralized network banner showing verified DReps and stake pool operators connected through a secure civic signal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.48" stop-color="#0b2750"/>
      <stop offset="1" stop-color="#111a36"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="46%">
      <stop offset="0" stop-color="#53d8ff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#3275ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#071426" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6de7ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7d8cff"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#88b9ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="720" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="720" rx="34" fill="url(#grid)"/>
  <rect width="1600" height="720" rx="34" fill="url(#glow)"/>

  <g opacity="0.28" stroke="#8edcff" stroke-width="2">
    <path d="M90 176C286 118 355 264 515 225S793 79 951 167s261 188 518 84" fill="none"/>
    <path d="M58 530c180-119 334 30 486-34s255-153 430-78 328 124 560 4" fill="none"/>
  </g>

  <g transform="translate(800 332)" filter="url(#softGlow)">
    <circle r="120" fill="#071426" stroke="#74ddff" stroke-width="3"/>
    <circle r="92" fill="#0d2348" stroke="#b4efff" stroke-opacity="0.55" stroke-width="2"/>
    <circle r="10" fill="#ffffff"/>
    <g fill="#89e7ff">
      <circle cx="0" cy="-58" r="9"/><circle cx="0" cy="58" r="9"/>
      <circle cx="-58" cy="0" r="9"/><circle cx="58" cy="0" r="9"/>
      <circle cx="-41" cy="-41" r="7"/><circle cx="41" cy="-41" r="7"/>
      <circle cx="-41" cy="41" r="7"/><circle cx="41" cy="41" r="7"/>
      <circle cx="0" cy="-34" r="5"/><circle cx="0" cy="34" r="5"/>
      <circle cx="-34" cy="0" r="5"/><circle cx="34" cy="0" r="5"/>
    </g>
    <g fill="#6d9dff">
      <circle cx="-77" cy="-27" r="5"/><circle cx="77" cy="-27" r="5"/>
      <circle cx="-77" cy="27" r="5"/><circle cx="77" cy="27" r="5"/>
      <circle cx="-27" cy="-77" r="5"/><circle cx="27" cy="-77" r="5"/>
      <circle cx="-27" cy="77" r="5"/><circle cx="27" cy="77" r="5"/>
    </g>
  </g>

  <g fill="none" stroke="url(#signal)" stroke-linecap="round" filter="url(#softGlow)">
    <path d="M630 332h62l24-34 34 70 31-53 27 34h162" stroke-width="7"/>
    <path d="M587 247a245 245 0 0 0 0 170" stroke-width="5" opacity="0.7"/>
    <path d="M546 205a305 305 0 0 0 0 254" stroke-width="3" opacity="0.42"/>
    <path d="M1013 247a245 245 0 0 1 0 170" stroke-width="5" opacity="0.7"/>
    <path d="M1054 205a305 305 0 0 1 0 254" stroke-width="3" opacity="0.42"/>
  </g>

  <g stroke="#83d9ff" stroke-opacity="0.55" stroke-width="2">
    <path d="M681 247L490 154M587 332L337 332M681 417L486 526M919 247l191-93M1013 332h250M919 417l195 109"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(470 154)"><circle r="55" fill="#102a52" stroke="#76ddff" stroke-width="3"/><text y="7" fill="#fff" font-size="26" font-weight="700">DRep</text></g>
    <g transform="translate(318 332)"><circle r="55" fill="#102a52" stroke="#76ddff" stroke-width="3"/><text y="7" fill="#fff" font-size="26" font-weight="700">SPO</text></g>
    <g transform="translate(466 538)"><circle r="55" fill="#102a52" stroke="#76ddff" stroke-width="3"/><text y="-4" fill="#fff" font-size="22" font-weight="700">API</text><text y="23" fill="#9ee9ff" font-size="14">Registry</text></g>
    <g transform="translate(1130 154)"><circle r="55" fill="#102a52" stroke="#8d9dff" stroke-width="3"/><text y="-4" fill="#fff" font-size="21" font-weight="700">Signed</text><text y="23" fill="#b9c2ff" font-size="14">Alerts</text></g>
    <g transform="translate(1282 332)"><circle r="55" fill="#102a52" stroke="#8d9dff" stroke-width="3"/><text y="-4" fill="#fff" font-size="20" font-weight="700">Pub-Sub</text><text y="23" fill="#b9c2ff" font-size="14">Network</text></g>
    <g transform="translate(1134 538)"><circle r="55" fill="#102a52" stroke="#8d9dff" stroke-width="3"/><text y="-4" fill="#fff" font-size="19" font-weight="700">Verified</text><text y="23" fill="#b9c2ff" font-size="14">Identity</text></g>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="92" fill="#ffffff" font-size="54" font-weight="800" letter-spacing="2">CARDANO CIVIC SIGNAL</text>
    <text x="800" y="137" fill="#a9eaff" font-size="22" font-weight="600" letter-spacing="3">DISCOVER • VERIFY • COORDINATE</text>
    <rect x="380" y="632" width="840" height="48" rx="24" fill="#091a33" stroke="#70dcff" stroke-opacity="0.6"/>
    <text x="800" y="663" fill="#dff8ff" font-size="20" font-weight="600">A decentralized registry and emergency communications network for DReps and SPOs</text>
  </g>

  <g fill="#c9f6ff">
    <circle cx="90" cy="95" r="3"/><circle cx="1500" cy="110" r="3"/><circle cx="1450" cy="615" r="3"/><circle cx="140" cy="620" r="3"/>
  </g>
</svg>
